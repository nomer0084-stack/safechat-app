<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1e1f22">
    <title>SafeChat Discord</title>
    <script src="crypto-js.min.js"></script>
    <style>
        :root {
            --bg-server: #1e1f22;
            --bg-channels: #2b2d31;
            --bg-chat: #313338;
            --bg-chat-dark: #1e1f22;
            --bg-input: #383a40;
            --blurple: #5865f2;
            --blurple-hover: #4752c4;
            --green: #23a55a;
            --danger: #f23f43;
            --text-normal: #dbdee1;
            --text-muted: #949ba4;
            --text-header: #f2f3f5;
        }

        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            overscroll-behavior: none;
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #1a1b1e; border-radius: 4px; }

        body {
            background: var(--bg-server);
            color: var(--text-normal);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            position: fixed;
            inset: 0;
        }

        /* Вход */
        #auth-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(25px); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .auth-card { background: var(--bg-chat); border-radius: 12px; padding: 32px 28px; width: 320px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.8); }
        .auth-card h2 { color: var(--text-header); margin-bottom: 6px; font-size: 22px; font-weight: 700; }
        .auth-card p { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }
        .auth-card input { width: 100%; padding: 12px 14px; background: var(--bg-server); border: none; border-radius: 6px; color: #fff; font-size: 15px; outline: none; margin-bottom: 16px; user-select: text; -webkit-user-select: text; }
        .btn-discord { width: 100%; padding: 12px; background: var(--blurple); border: none; border-radius: 6px; color: #fff; font-weight: 600; font-size: 15px; cursor: pointer; transition: 0.15s; }
        .btn-discord:hover { background: var(--blurple-hover); }

        /* 1. Левая колонка серверов */
        #guild-rail { width: 72px; background: var(--bg-server); display: flex; flex-direction: column; align-items: center; padding: 12px 0; gap: 8px; flex-shrink: 0; z-index: 10; }
        .guild-icon { width: 48px; height: 48px; border-radius: 50%; background: var(--bg-chat); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: border-radius 0.2s, background 0.2s; color: var(--text-header); }
        .guild-icon:hover, .guild-icon.active { border-radius: 16px; background: var(--blurple); color: #fff; }
        .guild-icon svg { width: 26px; height: 26px; fill: currentColor; }
        .guild-separator { width: 32px; height: 2px; background: rgba(255,255,255,0.08); border-radius: 1px; margin: 4px 0; }

        /* 2. Колонка каналов */
        #channels-sidebar { width: 240px; background: var(--bg-channels); display: flex; flex-direction: column; flex-shrink: 0; }
        .server-header { height: 48px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(0,0,0,0.2); font-weight: 700; color: var(--text-header); font-size: 15px; }
        .channel-list { flex: 1; overflow-y: auto; padding: 10px 8px; display: flex; flex-direction: column; gap: 2px; }
        .channel-category { font-size: 11px; font-weight: 700; color: var(--text-muted); padding: 12px 8px 4px; text-transform: uppercase; letter-spacing: 0.5px; }
        .channel-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 6px; cursor: pointer; color: var(--text-muted); font-size: 14px; font-weight: 600; transition: background 0.15s, color 0.15s; }
        .channel-item:hover { background: rgba(255,255,255,0.04); color: var(--text-normal); }
        .channel-item.active { background: rgba(255,255,255,0.08); color: var(--text-header); }
        .channel-icon-svg { width: 18px; height: 18px; stroke: currentColor; fill: none; flex-shrink: 0; }

        /* Панель пользователя */
        .user-panel { height: 54px; background: var(--bg-chat-dark); display: flex; align-items: center; padding: 0 8px; gap: 8px; }
        .user-avatar-wrap { position: relative; width: 34px; height: 34px; }
        .user-avatar { width: 100%; height: 100%; border-radius: 50%; background: var(--blurple); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; color: #fff; }
        .user-online-badge { position: absolute; bottom: -2px; right: -2px; width: 11px; height: 11px; background: var(--green); border-radius: 50%; border: 2px solid var(--bg-chat-dark); }
        .user-details { flex: 1; min-width: 0; }
        .user-name { font-size: 13px; font-weight: 700; color: var(--text-header); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .user-tag { font-size: 11px; color: var(--text-muted); }
        .user-action-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 6px; border-radius: 4px; display: flex; align-items: center; justify-content: center; }
        .user-action-btn:hover { background: rgba(255,255,255,0.06); color: var(--text-normal); }
        .user-action-btn svg { width: 18px; height: 18px; fill: currentColor; }

        /* 3. Главная область чата / стрима */
        #main-chat-area { flex: 1; background: var(--bg-chat); display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .chat-top-header { height: 48px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(0,0,0,0.2); }
        .chat-top-title { display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--text-header); font-size: 15px; }

        /* Сообщения */
        #messages-stream { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
        .discord-msg { display: flex; gap: 14px; }
        .msg-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--blurple); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; color: #fff; flex-shrink: 0; }
        .msg-content { flex: 1; }
        .msg-author-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
        .msg-author { font-size: 14px; font-weight: 600; color: var(--text-header); }
        .msg-time { font-size: 11px; color: var(--text-muted); }
        .msg-body { font-size: 14px; line-height: 1.4; color: var(--text-normal); word-break: break-word; user-select: text; -webkit-user-select: text; }

        /* Ввод */
        .discord-input-box { padding: 0 16px 20px; }
        .discord-input-wrap { background: var(--bg-input); border-radius: 8px; padding: 0 14px; display: flex; align-items: center; gap: 10px; height: 46px; }
        .discord-input-wrap input { flex: 1; background: none; border: none; outline: none; color: #fff; font-size: 14px; user-select: text; -webkit-user-select: text; }
        .discord-input-wrap input::placeholder { color: var(--text-muted); }
        .input-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 4px; }
        .input-btn:hover { color: var(--text-header); }
        .input-btn svg { width: 20px; height: 20px; fill: currentColor; }

        /* ОБЛАСТЬ СТРИМА ЭКРАНА */
        #voice-stream-view { display: none; flex: 1; flex-direction: column; background: #000; position: relative; }
        .stream-video-container { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        #screen-video-player { width: 100%; height: 100%; object-fit: contain; }

        /* НАСТРАИВАЕМАЯ ПАНЕЛЬ СТАТИСТИКИ (SafeChat Stream HUD) */
        #stream-hud {
            position: absolute;
            top: 14px;
            right: 14px;
            background: rgba(14, 16, 20, 0.88);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 100;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            cursor: move;
            min-width: 170px;
        }

        .hud-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 6px; margin-bottom: 2px; }
        .hud-title { font-size: 11px; font-weight: 800; color: #38bdf8; text-transform: uppercase; letter-spacing: 0.5px; display: flex; align-items: center; gap: 6px; }
        .hud-live-dot { width: 7px; height: 7px; background: var(--green); border-radius: 50%; box-shadow: 0 0 8px var(--green); }
        .hud-settings-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 2px; display: flex; align-items: center; }
        .hud-settings-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; }

        .hud-stat-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-family: monospace; }
        .hud-label { color: var(--text-muted); }
        .hud-val { font-weight: 700; color: #fff; }
        .hud-val.ping { color: #4ade80; }
        .hud-val.fps { color: #38bdf8; }

        /* Всплывающее меню переключения элементов оверлея */
        #hud-settings-popup {
            position: absolute;
            top: 40px;
            right: 0;
            background: var(--bg-channels);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 8px;
            padding: 8px 12px;
            display: none;
            flex-direction: column;
            gap: 6px;
            font-size: 12px;
            z-index: 110;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            min-width: 160px;
        }
        .hud-toggle-item { display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--text-normal); }
        .hud-toggle-item input { accent-color: var(--blurple); }

        /* Панель управления стримом */
        .voice-controls-bar { height: 70px; background: var(--bg-server); display: flex; align-items: center; justify-content: center; gap: 14px; padding: 0 16px; flex-wrap: wrap; }
        .fps-select-wrap { display: flex; align-items: center; gap: 6px; background: var(--bg-channels); padding: 6px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.06); font-size: 13px; font-weight: 600; color: var(--text-normal); }
        .fps-select-wrap select { background: none; border: none; color: var(--blurple); font-weight: 700; font-size: 13px; outline: none; cursor: pointer; }
        .fps-select-wrap select option { background: var(--bg-server); color: #fff; }

        .stream-ctrl-btn { height: 42px; padding: 0 16px; border-radius: 8px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; color: #fff; transition: 0.15s; }
        .stream-ctrl-btn svg { width: 18px; height: 18px; fill: currentColor; }
        .btn-screenshare { background: var(--blurple); }
        .btn-screenshare:hover { background: var(--blurple-hover); }
        .btn-disconnect { background: var(--danger); }

        @media (max-width: 768px) {
            #guild-rail { display: none; }
            #channels-sidebar { width: 100%; position: absolute; inset: 0; z-index: 20; }
            body.in-channel #channels-sidebar { display: none; }
            #main-chat-area { width: 100%; }
            .btn-mobile-back { display: flex !important; }
        }
        .btn-mobile-back { display: none; background: none; border: none; color: var(--text-normal); font-size: 22px; cursor: pointer; margin-right: 8px; }
    </style>
</head>
<body>
    <audio id="remoteVoiceAudio" autoplay></audio>

    <div id="auth-overlay">
        <div class="auth-card">
            <h2>SafeChat Discord</h2>
            <p>120 FPS / Минимальная задержка</p>
            <input type="text" id="auth-username" placeholder="Ваш никнейм" autofocus>
            <button class="btn-discord" onclick="submitAuth()">Войти</button>
        </div>
    </div>

    <!-- 1. Сервера -->
    <div id="guild-rail">
        <div class="guild-icon active" title="SafeChat Space">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9v-2h2v2zm0-4H9V7h2v5z"/></svg>
        </div>
        <div class="guild-separator"></div>
    </div>

    <!-- 2. Каналы -->
    <div id="channels-sidebar">
        <div class="server-header">
            <span>SafeChat Space</span>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M16.59 8.59L12 13.17 7.41 8.59 6 10l6 6 6-6z"/></svg>
        </div>

        <div class="channel-list">
            <div class="channel-category">Текстовые каналы</div>
            <div class="channel-item active" id="chan-general" onclick="selectChannel('general')">
                <svg class="channel-icon-svg" viewBox="0 0 24 24" stroke-width="2"><line x1="4" y1="9" x2="20" y2="9"></line><line x1="4" y1="15" x2="20" y2="15"></line><line x1="10" y1="3" x2="8" y2="21"></line><line x1="16" y1="3" x2="14" y2="21"></line></svg>
                главный
            </div>
            <div class="channel-item" id="chan-flood" onclick="selectChannel('flood')">
                <svg class="channel-icon-svg" viewBox="0 0 24 24" stroke-width="2"><line x1="4" y1="9" x2="20" y2="9"></line><line x1="4" y1="15" x2="20" y2="15"></line><line x1="10" y1="3" x2="8" y2="21"></line><line x1="16" y1="3" x2="14" y2="21"></line></svg>
                флудилка
            </div>

            <div class="channel-category" style="margin-top:12px;">Голос и Стрим</div>
            <div class="channel-item" id="chan-voice1" onclick="joinVoiceStreamRoom('voice1')">
                <svg class="channel-icon-svg" viewBox="0 0 24 24" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                Голосовой 1
            </div>
            <div class="channel-item" id="chan-stream" onclick="joinVoiceStreamRoom('stream')">
                <svg class="channel-icon-svg" viewBox="0 0 24 24" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
                Стрим-комната
            </div>
        </div>

        <div class="user-panel">
            <div class="user-avatar-wrap">
                <div class="user-avatar" id="current-user-avatar">?</div>
                <div class="user-online-badge"></div>
            </div>
            <div class="user-details">
                <div class="user-name" id="current-user-name">Гость</div>
                <div class="user-tag">#0001</div>
            </div>
            <div class="user-actions">
                <button class="user-action-btn" onclick="logout()" title="Выйти">
                    <svg viewBox="0 0 24 24"><path d="M10.09 15.59L11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59zM19 3H5c-1.11 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- 3. Основная область -->
    <div id="main-chat-area">
        <div class="chat-top-header">
            <div class="chat-top-title">
                <button class="btn-mobile-back" onclick="mobileBackToChannels()">‹</button>
                <span id="header-chan-icon" style="color:var(--text-muted); font-size:18px;">#</span>
                <span id="header-chan-title">главный</span>
            </div>
        </div>

        <!-- Текстовый чат E2EE -->
        <div id="messages-stream"></div>

        <div class="discord-input-box" id="chat-input-container">
            <div class="discord-input-wrap">
                <input type="text" id="discord-input" placeholder="Написать в #главный" onkeydown="if(event.key==='Enter') sendDiscordText()">
                <button class="input-btn" onclick="sendDiscordText()">
                    <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                </button>
            </div>
        </div>

        <!-- СТРИМ ЭКРАНА С ПЛАВАЮЩЕЙ ПАНЕЛЬЮ HUD -->
        <div id="voice-stream-view">
            <div class="stream-video-container">
                <video id="screen-video-player" autoplay playsinline></video>

                <!-- ПЛАВАЮЩАЯ ПАНЕЛЬ СТАТИСТИКИ (SafeChat HUD) -->
                <div id="stream-hud">
                    <div class="hud-header">
                        <div class="hud-title">
                            <div class="hud-live-dot"></div>
                            <span id="hud-title-text">SafeChat</span>
                        </div>
                        <button class="hud-settings-btn" onclick="toggleHudSettings(event)">
                            <svg viewBox="0 0 24 24" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                        </button>
                    </div>

                    <!-- Всплывающее меню настройки видимости параметров -->
                    <div id="hud-settings-popup">
                        <label class="hud-toggle-item"><input type="checkbox" id="cfg-show-ping" checked onchange="updateHudVisibility()"> Задержка</label>
                        <label class="hud-toggle-item"><input type="checkbox" id="cfg-show-fps" checked onchange="updateHudVisibility()"> Герцовка (FPS)</label>
                        <label class="hud-toggle-item"><input type="checkbox" id="cfg-show-res" checked onchange="updateHudVisibility()"> Разрешение</label>
                        <label class="hud-toggle-item"><input type="checkbox" id="cfg-show-bitrate" checked onchange="updateHudVisibility()"> Битрейт</label>
                    </div>

                    <!-- Строки параметров -->
                    <div class="hud-stat-row" id="hud-row-ping">
                        <span class="hud-label">Задержка:</span>
                        <span class="hud-val ping" id="hud-val-ping">16 ms</span>
                    </div>
                    <div class="hud-stat-row" id="hud-row-fps">
                        <span class="hud-label">Герцовка:</span>
                        <span class="hud-val fps" id="hud-val-fps">120 FPS</span>
                    </div>
                    <div class="hud-stat-row" id="hud-row-res">
                        <span class="hud-label">Качество:</span>
                        <span class="hud-val" id="hud-val-res">1080p</span>
                    </div>
                    <div class="hud-stat-row" id="hud-row-bitrate">
                        <span class="hud-label">Битрейт:</span>
                        <span class="hud-val" id="hud-val-bitrate">8.2 Mbps</span>
                    </div>
                </div>
            </div>

            <!-- Нижняя панель управления -->
            <div class="voice-controls-bar">
                <div class="fps-select-wrap">
                    <span>FPS:</span>
                    <select id="fps-selector" onchange="updateFpsConfig()">
                        <option value="30">30</option>
                        <option value="60">60</option>
                        <option value="120" selected>120</option>
                        <option value="144">144</option>
                        <option value="240">MAX</option>
                    </select>
                </div>

                <button class="stream-ctrl-btn btn-screenshare" onclick="toggleScreenShare()">
                    <svg viewBox="0 0 24 24"><path d="M20 18c1.1 0 1.99-.9 1.99-2L22 6c0-1.11-.9-2-2-2H4c-1.11 0-2 .89-2 2v10c0 1.1.89 2 2 2H0v2h24v-2h-4zM4 6h16v10H4V6z"/></svg>
                    Транслировать экран
                </button>

                <button class="stream-ctrl-btn btn-disconnect" onclick="leaveVoiceStreamRoom()">
                    <svg viewBox="0 0 24 24"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08a.99.99 0 0 1 0-1.41C3.28 8.77 7.42 7 12 7s8.72 1.77 11.71 4.67c.39.39.39 1.02 0 1.41l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.1-.7-.28-.79-.74-1.69-1.36-2.67-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/></svg>
                    Отключиться
                </button>
            </div>
        </div>
    </div>

    <script>
        const SECRET_KEY = "safechat_discord_e2ee_key_v1";
        let ws, myUser = '', currentChannel = 'general', currentVoiceRoom = null;
        let localScreenStream = null, peerConnection = null, hudStatsInterval = null;
        let targetFps = 120, prevBytes = 0, prevTimestamp = 0;
        const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        function encrypt(text) {
            return CryptoJS.AES.encrypt(text, SECRET_KEY).toString();
        }
        function decrypt(ciphertext) {
            try {
                const bytes = CryptoJS.AES.decrypt(ciphertext, SECRET_KEY);
                return bytes.toString(CryptoJS.enc.Utf8) || "Защищённое сообщение";
            } catch (e) {
                return "Ошибка расшифровки";
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            makeHudDraggable();
            const saved = localStorage.getItem('safechat_discord_user');
            if (saved) {
                myUser = saved;
                initConnection();
            }
        });

        function submitAuth() {
            const val = document.getElementById('auth-username').value.trim().toLowerCase();
            if (!val) return alert('Введите никнейм!');
            myUser = val;
            localStorage.setItem('safechat_discord_user', myUser);
            initConnection();
        }

        function initConnection() {
            document.getElementById('auth-overlay').style.display = 'none';
            document.getElementById('current-user-name').innerText = myUser;
            document.getElementById('current-user-avatar').innerText = myUser.charAt(0).toUpperCase();

            const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            const host = location.host || '2.56.118.10';
            ws = new WebSocket("ws://2.56.118.10");

            ws.onopen = () => {
                ws.send(JSON.stringify({ type: 'auth', username: myUser }));
                selectChannel('general');
            };

            ws.onmessage = async (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'channel_history') renderHistory(data.messages);
                else if (data.type === 'new_chat_msg') {
                    if (data.msg.channel === currentChannel) appendMessage(data.msg);
                } else if (data.type === 'rtc_signal') handleRtcSignal(data);
            };
        }

        function selectChannel(name) {
            currentChannel = name;
            document.body.classList.add('in-channel');
            document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
            const el = document.getElementById('chan-' + name);
            if (el) el.classList.add('active');

            document.getElementById('voice-stream-view').style.display = 'none';
            document.getElementById('messages-stream').style.display = 'flex';
            document.getElementById('chat-input-container').style.display = 'block';

            document.getElementById('header-chan-icon').innerText = '#';
            document.getElementById('header-chan-title').innerText = name;
            document.getElementById('discord-input').placeholder = 'Написать в #' + name;

            ws.send(JSON.stringify({ type: 'get_channel_history', channel: name }));
        }

        function renderHistory(msgs) {
            const box = document.getElementById('messages-stream');
            box.innerHTML = '';
            msgs.forEach(m => appendMessage(m));
            box.scrollTop = box.scrollHeight;
        }

        function appendMessage(m) {
            const box = document.getElementById('messages-stream');
            const row = document.createElement('div');
            row.className = 'discord-msg';
            const plainText = decrypt(m.ciphertext);
            row.innerHTML = `
                <div class="msg-avatar">${m.sender.charAt(0).toUpperCase()}</div>
                <div class="msg-content">
                    <div class="msg-author-row">
                        <span class="msg-author">@${escapeHtml(m.sender)}</span>
                        <span class="msg-time">${m.time}</span>
                    </div>
                    <div class="msg-body">${escapeHtml(plainText)}</div>
                </div>
            `;
            box.appendChild(row);
            box.scrollTop = box.scrollHeight;
        }

        function sendDiscordText() {
            const input = document.getElementById('discord-input');
            const text = input.value.trim();
            if (!text) return;
            const ciphertext = encrypt(text);
            ws.send(JSON.stringify({ type: 'chat_msg', channel: currentChannel, ciphertext }));
            input.value = '';
        }

        function mobileBackToChannels() { document.body.classList.remove('in-channel'); }

        // ================= НАСТРОЙКИ И МОНИТОРИНГ ОВЕРЛЕЯ HUD =================
        function toggleHudSettings(e) {
            e.stopPropagation();
            const p = document.getElementById('hud-settings-popup');
            p.style.display = p.style.display === 'flex' ? 'none' : 'flex';
        }
        window.addEventListener('click', () => {
            const p = document.getElementById('hud-settings-popup');
            if (p) p.style.display = 'none';
        });

        function updateHudVisibility() {
            document.getElementById('hud-row-ping').style.display = document.getElementById('cfg-show-ping').checked ? 'flex' : 'none';
            document.getElementById('hud-row-fps').style.display = document.getElementById('cfg-show-fps').checked ? 'flex' : 'none';
            document.getElementById('hud-row-res').style.display = document.getElementById('cfg-show-res').checked ? 'flex' : 'none';
            document.getElementById('hud-row-bitrate').style.display = document.getElementById('cfg-show-bitrate').checked ? 'flex' : 'none';
        }

        function startHudMonitoring() {
            clearInterval(hudStatsInterval);
            hudStatsInterval = setInterval(async () => {
                const vid = document.getElementById('screen-video-player');
                if (vid && vid.videoWidth) {
                    document.getElementById('hud-val-res').innerText = `${vid.videoWidth}x${vid.videoHeight}`;
                }

                if (peerConnection) {
                    try {
                        const stats = await peerConnection.getStats();
                        stats.forEach(report => {
                            if (report.type === 'candidate-pair' && report.state === 'succeeded' && report.currentRoundTripTime !== undefined) {
                                const ms = Math.round(report.currentRoundTripTime * 1000);
                                document.getElementById('hud-val-ping').innerText = `${ms} ms`;
                            }
                            if ((report.type === 'inbound-rtp' || report.type === 'outbound-rtp') && report.kind === 'video') {
                                if (report.framesPerSecond !== undefined) {
                                    document.getElementById('hud-val-fps').innerText = `${Math.round(report.framesPerSecond)} FPS`;
                                }
                                const bytes = report.bytesReceived || report.bytesSent || 0;
                                const now = report.timestamp;
                                if (prevTimestamp && bytes > prevBytes) {
                                    const mbps = ((bytes - prevBytes) * 8 / ((now - prevTimestamp) / 1000) / 1000000).toFixed(1);
                                    document.getElementById('hud-val-bitrate').innerText = `${mbps} Mbps`;
                                }
                                prevBytes = bytes;
                                prevTimestamp = now;
                            }
                        });
                    } catch(e) {}
                }
            }, 1000);
        }

        // Перетаскивание панели оверлея
        function makeHudDraggable() {
            const hud = document.getElementById('stream-hud');
            let isDragging = false, startX, startY, initX, initY;

            const onStart = (e) => {
                if (e.target.closest('#hud-settings-popup') || e.target.closest('.hud-settings-btn')) return;
                isDragging = true;
                const p = e.touches ? e.touches[0] : e;
                startX = p.clientX; startY = p.clientY;
                const rect = hud.getBoundingClientRect();
                initX = rect.left; initY = rect.top;
            };

            const onMove = (e) => {
                if (!isDragging) return;
                const p = e.touches ? e.touches[0] : e;
                const dx = p.clientX - startX;
                const dy = p.clientY - startY;
                hud.style.left = (initX + dx) + 'px';
                hud.style.top = (initY + dy) + 'px';
                hud.style.right = 'auto';
            };

            const onEnd = () => { isDragging = false; };

            hud.addEventListener('mousedown', onStart);
            window.addEventListener('mousemove', onMove);
            window.addEventListener('mouseup', onEnd);
            hud.addEventListener('touchstart', onStart, { passive: true });
            window.addEventListener('touchmove', onMove, { passive: true });
            window.addEventListener('touchend', onEnd);
        }

        function updateFpsConfig() {
            targetFps = parseInt(document.getElementById('fps-selector').value) || 120;
            document.getElementById('hud-val-fps').innerText = `${targetFps} FPS`;
            if (localScreenStream) {
                const track = localScreenStream.getVideoTracks()[0];
                if (track) track.applyConstraints({ frameRate: { ideal: targetFps, max: targetFps } });
            }
        }

        // ================= СТРИМ ЭКРАНА =================
        function joinVoiceStreamRoom(room) {
            currentVoiceRoom = room;
            document.body.classList.add('in-channel');
            document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
            document.getElementById('chan-' + room).classList.add('active');

            document.getElementById('header-chan-icon').innerText = '>';
            document.getElementById('header-chan-title').innerText = room;

            document.getElementById('messages-stream').style.display = 'none';
            document.getElementById('chat-input-container').style.display = 'none';
            document.getElementById('voice-stream-view').style.display = 'flex';

            ws.send(JSON.stringify({ type: 'join_voice', room }));
        }

        function leaveVoiceStreamRoom() {
            clearInterval(hudStatsInterval);
            if (localScreenStream) {
                localScreenStream.getTracks().forEach(t => t.stop());
                localScreenStream = null;
            }
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            document.getElementById('screen-video-player').srcObject = null;
            ws.send(JSON.stringify({ type: 'leave_voice' }));
            selectChannel('general');
        }

        async function toggleScreenShare() {
            try {
                updateFpsConfig();
                localScreenStream = await navigator.mediaDevices.getDisplayMedia({
                    video: { cursor: "always", frameRate: { ideal: targetFps, max: targetFps }, width: { ideal: 1920 }, height: { ideal: 1080 } },
                    audio: true
                });

                document.getElementById('screen-video-player').srcObject = localScreenStream;
                peerConnection = new RTCPeerConnection(rtcConfig);
                localScreenStream.getTracks().forEach(track => {
                    const sender = peerConnection.addTrack(track, localScreenStream);
                    if (sender.setParameters) {
                        const params = sender.getParameters();
                        params.degradationPreference = 'maintain-framerate';
                        sender.setParameters(params);
                    }
                });

                peerConnection.onicecandidate = e => {
                    if (e.candidate) ws.send(JSON.stringify({ type: 'rtc_signal', sub: 'ice', candidate: e.candidate }));
                };

                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                ws.send(JSON.stringify({ type: 'rtc_signal', sub: 'offer', sdp: offer }));

                startHudMonitoring();
                localScreenStream.getVideoTracks()[0].onended = () => leaveVoiceStreamRoom();
            } catch (e) {
                alert('Не удалось начать трансляцию');
            }
        }

        async function handleRtcSignal(data) {
            if (data.sub === 'offer') {
                peerConnection = new RTCPeerConnection(rtcConfig);
                peerConnection.ontrack = e => {
                    const player = document.getElementById('screen-video-player');
                    player.srcObject = e.streams[0];
                    if (e.receiver && 'playoutDelayHint' in e.receiver) e.receiver.playoutDelayHint = 0;
                };
                peerConnection.onicecandidate = e => {
                    if (e.candidate) ws.send(JSON.stringify({ type: 'rtc_signal', sub: 'ice', candidate: e.candidate }));
                };
                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp));
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);
                ws.send(JSON.stringify({ type: 'rtc_signal', sub: 'answer', sdp: answer }));
                startHudMonitoring();
            } else if (data.sub === 'answer' && peerConnection) {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp));
            } else if (data.sub === 'ice' && peerConnection) {
                await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
            }
        }

        function logout() {
            if (confirm('Выйти из аккаунта?')) {
                localStorage.removeItem('safechat_discord_user');
                location.reload();
            }
        }

        function escapeHtml(str) {
            return (str || '').replace(/[&<>'"]/g, t => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[t] || t));
        }
    </script>
