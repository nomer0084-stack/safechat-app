<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#17212b">
    <title>SafeChat</title>
    <script src="crypto-js.min.js"></script>
    <style>
        :root {
            --bg-main: #0e1621;
            --bg-sidebar: #17212b;
            --bg-active: #242f3d;
            --bubble-out: #2b5278;
            --bubble-in: #182533;
            --accent: #2aabee;
            --accent-hover: #229ed9;
            --text-primary: #f5f5f5;
            --text-secondary: #7f91a4;
            --border: rgba(255, 255, 255, 0.08);
            --danger: #ef4444;
            --green: #4fae4e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-main); color: var(--text-primary); height: 100vh; overflow: hidden; display: flex; }

        /* Авторизация */
        #auth-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(15px); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .auth-card { background: var(--bg-sidebar); border-radius: 24px; padding: 32px 26px; width: 100%; max-width: 350px; text-align: center; border: 1px solid var(--border); box-shadow: 0 25px 50px rgba(0,0,0,0.6); }
        .auth-logo { width: 64px; height: 64px; background: linear-gradient(135deg, #2aabee, #1d6ed8); border-radius: 20px; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; font-size: 32px; box-shadow: 0 8px 20px rgba(42,171,238,0.3); }
        .auth-card h2 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
        .auth-tabs { display: flex; gap: 8px; margin: 20px 0; background: var(--bg-main); padding: 4px; border-radius: 14px; }
        .auth-tab { flex: 1; padding: 10px; border: none; background: none; color: var(--text-secondary); font-size: 14px; font-weight: 600; border-radius: 10px; cursor: pointer; transition: 0.2s; }
        .auth-tab.active { background: var(--accent); color: #fff; box-shadow: 0 2px 8px rgba(42,171,238,0.3); }
        .auth-card input { width: 100%; padding: 14px 16px; background: var(--bg-main); border: 1px solid var(--border); border-radius: 12px; color: #fff; margin-bottom: 12px; font-size: 15px; outline: none; transition: 0.2s; }
        .auth-card input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(42,171,238,0.2); }
        .btn-submit { width: 100%; padding: 14px; background: var(--accent); border: none; border-radius: 12px; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.15s; }
        .btn-submit:active { transform: scale(0.98); background: var(--accent-hover); }

        /* Диалог создания чата */
        #new-chat-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(10px); display: none; align-items: center; justify-content: center; z-index: 500; padding: 20px; }
        .modal-box { background: var(--bg-sidebar); border-radius: 20px; padding: 24px; width: 100%; max-width: 320px; text-align: center; border: 1px solid var(--border); }
        .modal-box h3 { margin-bottom: 12px; font-size: 18px; }
        .modal-box input { width: 100%; padding: 12px 16px; background: var(--bg-main); border: 1px solid var(--border); border-radius: 12px; color: #fff; margin-bottom: 16px; font-size: 15px; outline: none; }
        .modal-btns { display: flex; gap: 10px; }
        .btn-cancel { flex: 1; padding: 12px; background: rgba(255,255,255,0.06); border: none; border-radius: 10px; color: #fff; cursor: pointer; }
        .btn-confirm { flex: 1; padding: 12px; background: var(--accent); border: none; border-radius: 10px; color: #fff; font-weight: 600; cursor: pointer; }

        /* Просмотр фото на весь экран */
        #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 2000; display: none; align-items: center; justify-content: center; padding: 16px; }
        #lightbox img { max-width: 100%; max-height: 90vh; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); }
        #lightbox .close-btn { position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.15); border: none; color: #fff; width: 40px; height: 40px; border-radius: 50%; font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        /* Главный экран */
        #app { display: none; width: 100vw; height: 100vh; position: relative; overflow: hidden; }

        /* Боковая панель */
        #sidebar { width: 380px; background: var(--bg-sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; height: 100%; z-index: 1; position: absolute; left: 0; top: 0; bottom: 0; transition: transform 0.28s cubic-bezier(0.32, 0.72, 0, 1); }
        .sidebar-header { padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
        .header-title-box { display: flex; align-items: center; gap: 10px; }
        .my-avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #2aabee, #1d6ed8); display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: #fff; }
        .user-pill { font-weight: 700; font-size: 16px; }
        .btn-logout { background: none; border: none; color: var(--text-secondary); font-size: 18px; cursor: pointer; padding: 4px; border-radius: 8px; transition: 0.15s; }
        .btn-new-chat { background: var(--accent); color: #fff; border: none; width: 36px; height: 36px; border-radius: 50%; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(42,171,238,0.3); transition: transform 0.15s; }
        .btn-new-chat:active { transform: scale(0.9); }

        .search-box { padding: 10px 16px; border-bottom: 1px solid var(--border); }
        .search-box input { width: 100%; padding: 9px 14px; background: var(--bg-main); border: 1px solid var(--border); border-radius: 20px; color: #fff; font-size: 14px; outline: none; }

        .chat-list { flex: 1; overflow-y: auto; }
        .chat-item { display: flex; align-items: center; gap: 14px; padding: 12px 16px; cursor: pointer; border-bottom: 1px solid var(--border); transition: background 0.15s; }
        .chat-item:active, .chat-item.active { background: var(--bg-active); }
        .avatar-box { position: relative; width: 50px; height: 50px; flex-shrink: 0; }
        .avatar { width: 100%; height: 100%; border-radius: 50%; background: linear-gradient(135deg, #2aabee, #1d6ed8); display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; color: #fff; }
        .online-dot { position: absolute; bottom: 1px; right: 1px; width: 12px; height: 12px; background: var(--green); border: 2px solid var(--bg-sidebar); border-radius: 50%; display: none; }
        .online-dot.active { display: block; }
        .chat-info { flex: 1; min-width: 0; }
        .chat-header-row { display: flex; justify-content: space-between; align-items: baseline; }
        .chat-name { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-time { font-size: 12px; color: var(--text-secondary); }
        .chat-preview { font-size: 13px; color: var(--text-secondary); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Окно переписки */
        #chat-window { position: absolute; inset: 0; background: var(--bg-main); background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px); background-size: 24px 24px; display: flex; flex-direction: column; z-index: 2; transform: translateX(100%); transition: transform 0.28s cubic-bezier(0.32, 0.72, 0, 1); }
        .chat-header { padding: 10px 16px; background: rgba(23, 33, 43, 0.96); backdrop-filter: blur(20px); display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border); }
        .btn-back { background: none; border: none; color: var(--accent); font-size: 28px; cursor: pointer; line-height: 1; padding-right: 6px; }
        .chat-title { font-size: 16px; font-weight: 600; }
        .chat-status { font-size: 12px; color: var(--text-secondary); transition: color 0.2s; }
        .chat-status.online { color: var(--green); font-weight: 500; }

        #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
        .msg-row { display: flex; width: 100%; position: relative; }
        .msg-row.my { justify-content: flex-end; }
        .msg-row.other { justify-content: flex-start; }
        .bubble { max-width: 78%; padding: 8px 12px; border-radius: 18px; font-size: 15px; line-height: 1.42; word-break: break-word; box-shadow: 0 1px 2px rgba(0,0,0,0.25); cursor: pointer; user-select: none; }
        .msg-row.my .bubble { background: var(--bubble-out); color: #fff; border-bottom-right-radius: 4px; }
        .msg-row.other .bubble { background: var(--bubble-in); color: var(--text-primary); border-bottom-left-radius: 4px; }
        .msg-meta { font-size: 10px; opacity: 0.7; margin-top: 4px; display: flex; justify-content: flex-end; gap: 4px; align-items: center; }

        .bubble img { max-width: 100%; max-height: 320px; border-radius: 12px; margin-top: 4px; display: block; cursor: pointer; transition: opacity 0.15s; }
        .bubble img:active { opacity: 0.85; }
        .bubble video { max-width: 100%; border-radius: 12px; margin-top: 4px; display: block; }

        /* Кастомный аудиоплеер для голосовых */
        .voice-card { display: flex; align-items: center; gap: 12px; padding: 4px 2px; width: 220px; }
        .voice-play-btn { width: 38px; height: 38px; border-radius: 50%; background: var(--accent); color: #fff; border: none; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 2px 8px rgba(42,171,238,0.3); }
        .voice-body { flex: 1; display: flex; flex-direction: column; gap: 4px; }
        .voice-progress-bar { width: 100%; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; overflow: hidden; position: relative; }
        .voice-progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.1s linear; }
        .voice-time { font-size: 11px; opacity: 0.7; }

        /* Кнопка прокрутки вниз */
        #btn-scroll-bottom { position: absolute; right: 18px; bottom: 70px; width: 42px; height: 42px; border-radius: 50%; background: rgba(23, 33, 43, 0.9); backdrop-filter: blur(10px); border: 1px solid var(--border); color: var(--accent); display: none; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: transform 0.2s; z-index: 5; }
        #btn-scroll-bottom:active { transform: scale(0.9); }

        /* Панель ввода */
        .input-bar { padding: 8px 12px; background: rgba(23, 33, 43, 0.98); backdrop-filter: blur(20px); display: flex; gap: 8px; align-items: center; border-top: 1px solid var(--border); }
        .input-bar input { flex: 1; padding: 10px 16px; background: var(--bg-main); border: 1px solid var(--border); border-radius: 20px; color: #fff; font-size: 15px; outline: none; }
        .btn-action { background: none; border: none; color: var(--text-secondary); font-size: 22px; width: 38px; height: 38px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.15s; }
        .btn-action:active { transform: scale(0.9); }
        .btn-action.recording { color: var(--danger); animation: pulse 0.8s infinite alternate; }
        .btn-send { background: var(--accent); color: #fff; border: none; width: 38px; height: 38px; border-radius: 50%; font-size: 17px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 2px 8px rgba(42,171,238,0.3); transition: transform 0.15s; }
        .btn-send:active { transform: scale(0.9); }

        /* Контекстное меню сообщения */
        #msg-context-menu { position: fixed; background: rgba(23, 33, 43, 0.95); backdrop-filter: blur(15px); border: 1px solid var(--border); border-radius: 14px; padding: 6px; display: none; flex-direction: column; z-index: 3000; box-shadow: 0 10px 30px rgba(0,0,0,0.6); min-width: 150px; }
        .context-item { padding: 10px 14px; font-size: 14px; border: none; background: none; color: #fff; text-align: left; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 10px; }
        .context-item:hover, .context-item:active { background: var(--bg-active); }
        .context-item.danger { color: var(--danger); }

        @keyframes pulse { from { opacity: 0.3; } to { opacity: 1; } }

        @media (min-width: 769px) {
            #sidebar { width: 380px; position: static; transform: none !important; }
            #chat-window { position: static; transform: none !important; flex: 1; }
            .btn-back { display: none; }
        }
        @media (max-width: 768px) {
            #sidebar { width: 100%; }
            body.in-chat #sidebar { transform: translateX(-25%); }
            body.in-chat #chat-window { transform: translateX(0); }
        }
    </style>
</head>
<body>
    <div id="auth-modal">
        <div class="auth-card">
            <div class="auth-logo">🛡️</div>
            <h2 id="auth-title">SafeChat</h2>
            <div class="auth-tabs">
                <button class="auth-tab active" id="tab-login" onclick="setAuthMode('login')">Вход</button>
                <button class="auth-tab" id="tab-reg" onclick="setAuthMode('register')">Регистрация</button>
            </div>
            <input type="text" id="username" placeholder="Ваш логин" autocapitalize="none">
            <input type="password" id="password" placeholder="Пароль">
            <button class="btn-submit" id="btn-submit" onclick="submitAuth()">Войти</button>
        </div>
    </div>

    <div id="new-chat-modal">
        <div class="modal-box">
            <h3>Новый диалог</h3>
            <input type="text" id="target-user" placeholder="Логин пользователя..." autocapitalize="none">
            <div class="modal-btns">
                <button class="btn-cancel" onclick="closeNewChatModal()">Отмена</button>
                <button class="btn-confirm" onclick="confirmNewChat()">Начать</button>
            </div>
        </div>
    </div>

    <div id="lightbox" onclick="closeLightbox()">
        <button class="close-btn">&times;</button>
        <img id="lightbox-img" src="" onclick="event.stopPropagation()">
    </div>

    <div id="msg-context-menu">
        <button class="context-item" onclick="copyContextMsg()">📋 Копировать</button>
        <button class="context-item danger" onclick="deleteContextMsg()">🗑️ Удалить для всех</button>
    </div>

    <div id="app">
        <div id="sidebar">
            <div class="sidebar-header">
                <div class="header-title-box">
                    <div class="my-avatar" id="my-avatar-letter">?</div>
                    <span class="user-pill" id="my-label"></span>
                    <button class="btn-logout" onclick="logout()" title="Выйти">🚪</button>
                </div>
                <button class="btn-new-chat" onclick="openNewChatModal()" title="Новый диалог">+</button>
            </div>
            <div class="search-box">
                <input type="text" id="chat-search" placeholder="Поиск по диалогам..." oninput="filterChats(this.value)">
            </div>
            <div class="chat-list" id="chat-list"></div>
        </div>

        <div id="chat-window">
            <div class="chat-header">
                <button class="btn-back" onclick="closeChat()">‹</button>
                <div class="chat-info">
                    <div class="chat-title" id="current-chat-title">Чат</div>
                    <div class="chat-status" id="current-chat-status">сквозное шифрование</div>
                </div>
            </div>
            
            <div id="messages" onscroll="handleMessagesScroll()"></div>
            
            <button id="btn-scroll-bottom" onclick="scrollToBottom(true)">↓</button>

            <div class="input-bar" id="input-bar">
                <input type="file" id="file-input" style="display: none;" accept="image/*,video/*" onchange="handleFile(this)">
                <button class="btn-action" onclick="document.getElementById('file-input').click()" title="Фото/Видео">📎</button>
                <input type="text" id="msg-input" placeholder="Сообщение..." oninput="handleTyping()" onkeydown="if(event.key==='Enter') sendText()">
                <button class="btn-action" id="record-btn" onclick="toggleVoiceRecord()" title="Голосовое">🎙️</button>
                <button class="btn-send" onclick="sendText()">➤</button>
            </div>
        </div>
    </div>

    <script>
        let ws, myUser = '', myPassHash = '', activeChatId = '', activeCompanion = '', authMode = 'login';
        let allChats = [], typingTimeout = null, contextMsgId = null, contextText = '';
        let mediaRecorder, audioChunks = [], isRecording = false, voiceTimerInterval = null, voiceSeconds = 0;
        let reconnectInterval = null;

        function setAuthMode(mode) {
            authMode = mode;
            document.getElementById('tab-login').classList.toggle('active', mode === 'login');
            document.getElementById('tab-reg').classList.toggle('active', mode === 'register');
            document.getElementById('btn-submit').innerText = mode === 'login' ? 'Войти' : 'Создать аккаунт';
        }

        window.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('safechat_session');
            if (saved) {
                try {
                    const session = JSON.parse(saved);
                    if (session.username && session.passHash) {
                        connectWS(session.username, session.passHash, 'login', true);
                    }
                } catch(e) {}
            }
        });

        function submitAuth() {
            const username = document.getElementById('username').value.trim().toLowerCase();
            const password = document.getElementById('password').value.trim();
            if (!username || !password) return alert('Введите логин и пароль!');

            const passHash = CryptoJS.SHA256(username + ":" + password).toString();
            connectWS(username, passHash, authMode, false);
        }

        function connectWS(username, passHash, mode, isAuto) {
            if (ws && ws.readyState === WebSocket.OPEN) return;

            const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket("ws://2.56.118.10");

            ws.onopen = () => {
                clearInterval(reconnectInterval);
                ws.send(JSON.stringify({ type: mode, username, passHash }));
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'auth_success') {
                    myUser = data.username;
                    myPassHash = data.passHash;
                    localStorage.setItem('safechat_session', JSON.stringify({ username: myUser, passHash: myPassHash }));

                    document.getElementById('auth-modal').style.display = 'none';
                    document.getElementById('app').style.display = 'flex';
                    document.getElementById('my-label').innerText = '@' + myUser;
                    document.getElementById('my-avatar-letter').innerText = myUser.charAt(0).toUpperCase();
                } else if (data.type === 'auth_error') {
                    if (isAuto) localStorage.removeItem('safechat_session');
                    else alert(data.message);
                } else if (data.type === 'chat_list') {
                    allChats = data.chats;
                    renderChats(allChats);
                } else if (data.type === 'open_chat') {
                    openChat(data.chatId, data.companion, data.online);
                } else if (data.type === 'status_change') {
                    handleStatusChange(data.user, data.online);
                } else if (data.type === 'history') {
                    if (data.chatId === activeChatId) {
                        renderMessages(data.messages);
                        updateCompanionStatus(data.companionOnline);
                    }
                } else if (data.type === 'new_msg') {
                    if (data.message.chatId === activeChatId) {
                        appendMessage(data.message);
                        scrollToBottom(true);
                    }
                    if (data.message.sender !== myUser) {
                        playChime();
                        if (navigator.vibrate) navigator.vibrate(20);
                    }
                } else if (data.type === 'msg_deleted') {
                    const el = document.getElementById('msg-' + data.msgId);
                    if (el) el.remove();
                } else if (data.type === 'user_typing') {
                    if (data.chatId === activeChatId) {
                        const status = document.getElementById('current-chat-status');
                        status.innerText = data.status || 'печатает...';
                        status.classList.add('online');
                        clearTimeout(typingTimeout);
                        typingTimeout = setTimeout(() => {
                            updateCompanionStatus(allChats.find(c => c.chatId === activeChatId)?.online);
                        }, 2500);
                    }
                } else if (data.type === 'error') {
                    alert(data.message);
                }
            };

            ws.onclose = () => {
                // Автоматическое переподключение
                clearInterval(reconnectInterval);
                reconnectInterval = setInterval(() => {
                    if (myUser && myPassHash) {
                        connectWS(myUser, myPassHash, 'login', true);
                    }
                }, 3000);
            };
        }

        function handleStatusChange(user, isOnline) {
            const chat = allChats.find(c => c.companion === user);
            if (chat) {
                chat.online = isOnline;
                renderChats(allChats);
                if (chat.chatId === activeChatId) {
                    updateCompanionStatus(isOnline);
                }
            }
        }

        function updateCompanionStatus(isOnline) {
            const status = document.getElementById('current-chat-status');
            if (isOnline) {
                status.innerText = 'в сети';
                status.classList.add('online');
            } else {
                status.innerText = 'был(а) недавно';
                status.classList.remove('online');
            }
        }

        function logout() {
            if (confirm('Выйти из аккаунта?')) {
                localStorage.removeItem('safechat_session');
                location.reload();
            }
        }

        function filterChats(query) {
            const q = query.toLowerCase();
            const filtered = allChats.filter(c => c.companion.toLowerCase().includes(q));
            renderChats(filtered);
        }

        function renderChats(chats) {
            const list = document.getElementById('chat-list');
            list.innerHTML = '';
            if (chats.length === 0) {
                list.innerHTML = '<div style="padding: 24px; text-align: center; color: var(--text-secondary); font-size: 14px;">Диалогов пока нет</div>';
                return;
            }
            chats.forEach(chat => {
                const div = document.createElement('div');
                div.className = 'chat-item' + (chat.chatId === activeChatId ? ' active' : '');
                div.onclick = () => openChat(chat.chatId, chat.companion, chat.online);
                div.innerHTML = `
                    <div class="avatar-box">
                        <div class="avatar">${chat.companion.charAt(0).toUpperCase()}</div>
                        <div class="online-dot ${chat.online ? 'active' : ''}"></div>
                    </div>
                    <div class="chat-info">
                        <div class="chat-header-row">
                            <div class="chat-name">${escapeHtml(chat.companion)}</div>
                            <div class="chat-time">${chat.lastMsgTime || ''}</div>
                        </div>
                        <div class="chat-preview">Зашифрованный диалог</div>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        function openNewChatModal() {
            document.getElementById('new-chat-modal').style.display = 'flex';
            document.getElementById('target-user').value = '';
            document.getElementById('target-user').focus();
        }

        function closeNewChatModal() {
            document.getElementById('new-chat-modal').style.display = 'none';
        }

        function confirmNewChat() {
            const target = document.getElementById('target-user').value.trim();
            if (target) {
                ws.send(JSON.stringify({ type: 'create_chat', targetUser: target }));
                closeNewChatModal();
            }
        }

        function openChat(chatId, companion, online) {
            activeChatId = chatId;
            activeCompanion = companion;
            document.body.classList.add('in-chat');
            document.getElementById('current-chat-title').innerText = companion;
            updateCompanionStatus(online);
            document.getElementById('messages').innerHTML = '';
            ws.send(JSON.stringify({ type: 'get_history', chatId }));
            renderChats(allChats);
        }

        function closeChat() {
            document.body.classList.remove('in-chat');
            activeChatId = '';
        }

        function renderMessages(msgs) {
            const box = document.getElementById('messages');
            box.innerHTML = '';
            msgs.forEach(m => appendMessage(m));
            scrollToBottom(false);
        }

        function appendMessage(msg) {
            const box = document.getElementById('messages');
            const row = document.createElement('div');
            row.id = 'msg-' + msg.id;
            const isMy = msg.sender === myUser;
            row.className = 'msg-row ' + (isMy ? 'my' : 'other');

            const payload = decrypt(msg.ciphertext, activeChatId + "_secret_key");
            let contentHtml = '';

            if (payload.type === 'text') {
                contentHtml = `<div>${escapeHtml(payload.content)}</div>`;
            } else if (payload.type === 'image') {
                contentHtml = `<img src="${payload.content}" onclick="openLightbox('${payload.content}')">`;
            } else if (payload.type === 'video') {
                contentHtml = `<video controls playsinline src="${payload.content}"></video>`;
            } else if (payload.type === 'voice') {
                contentHtml = createVoicePlayerHtml(payload.content);
            }

            row.innerHTML = `
                <div class="bubble" oncontextmenu="openMsgMenu(event, '${msg.id}', '${escapeAttr(payload.content || '')}')">
                    ${contentHtml}
                    <div class="msg-meta">
                        <span>${msg.time}</span>
                        ${isMy ? '<span>✓✓</span>' : ''}
                    </div>
                </div>
            `;
            box.appendChild(row);
        }

        function createVoicePlayerHtml(base64Audio) {
            const uid = 'voice_' + Math.random().toString(36).substr(2, 6);
            return `
                <div class="voice-card">
                    <button class="voice-play-btn" id="btn-${uid}" onclick="togglePlayVoice('${uid}', '${base64Audio}')">▶</button>
                    <div class="voice-body">
                        <div class="voice-progress-bar">
                            <div class="voice-progress-fill" id="fill-${uid}"></div>
                        </div>
                        <div class="voice-time" id="time-${uid}">Голосовое</div>
                    </div>
                </div>
            `;
        }

        let currentAudio = null;
        function togglePlayVoice(uid, src) {
            if (currentAudio && !currentAudio.paused) {
                currentAudio.pause();
                currentAudio = null;
                document.querySelectorAll('.voice-play-btn').forEach(b => b.innerText = '▶');
                return;
            }

            const audio = new Audio(src);
            currentAudio = audio;
            const btn = document.getElementById('btn-' + uid);
            const fill = document.getElementById('fill-' + uid);
            const timeLabel = document.getElementById('time-' + uid);

            btn.innerText = '⏸';
            audio.play();

            audio.ontimeupdate = () => {
                const pct = (audio.currentTime / audio.duration) * 100;
                fill.style.width = pct + '%';
                timeLabel.innerText = formatTime(Math.floor(audio.currentTime));
            };

            audio.onended = () => {
                btn.innerText = '▶';
                fill.style.width = '0%';
                timeLabel.innerText = 'Голосовое';
                currentAudio = null;
            };
        }

        function formatTime(sec) {
            const m = Math.floor(sec / 60);
            const s = sec % 60;
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function handleTyping() {
            if (activeChatId && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'typing', chatId: activeChatId, status: 'печатает...' }));
            }
        }

        function sendPayload(payload) {
            if (!activeChatId) return;
            const ciphertext = encrypt(payload, activeChatId + "_secret_key");
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            ws.send(JSON.stringify({ type: 'msg', chatId: activeChatId, ciphertext, time }));
            if (navigator.vibrate) navigator.vibrate(10);
        }

        function sendText() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (!text) return;
            sendPayload({ type: 'text', content: text });
            input.value = '';
        }

        // Оптимизация и сжатие картинок перед шифрованием
        function handleFile(input) {
            const file = input.files[0];
            if (!file) return;

            if (file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let w = img.width, h = img.height;
                        const maxDim = 1400;
                        if (w > maxDim || h > maxDim) {
                            if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
                            else { w = Math.round((w * maxDim) / h); h = maxDim; }
                        }
                        canvas.width = w; canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        const optimizedBase64 = canvas.toDataURL('image/jpeg', 0.82);
                        sendPayload({ type: 'image', content: optimizedBase64 });
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            } else {
                const reader = new FileReader();
                reader.onload = (e) => sendPayload({ type: 'video', content: e.target.result });
                reader.readAsDataURL(file);
            }
            input.value = '';
        }

        // Запись голосовых
        async function toggleVoiceRecord() {
            const btn = document.getElementById('record-btn');
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    voiceSeconds = 0;

                    ws.send(JSON.stringify({ type: 'typing', chatId: activeChatId, status: 'записывает голосовое...' }));

                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        const blob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.onload = (e) => sendPayload({ type: 'voice', content: e.target.result });
                        reader.readAsDataURL(blob);
                        stream.getTracks().forEach(t => t.stop());
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    btn.classList.add('recording');
                    if (navigator.vibrate) navigator.vibrate(25);
                } catch (e) {
                    alert('Доступ к микрофону заблокирован.');
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                btn.classList.remove('recording');
            }
        }

        function scrollToBottom(smooth) {
            const box = document.getElementById('messages');
            box.scrollTo({ top: box.scrollHeight, behavior: smooth ? 'smooth' : 'auto' });
        }

        function handleMessagesScroll() {
            const box = document.getElementById('messages');
            const btn = document.getElementById('btn-scroll-bottom');
            const distFromBottom = box.scrollHeight - box.scrollTop - box.clientHeight;
            btn.style.display = distFromBottom > 200 ? 'flex' : 'none';
        }

        // Контекстное меню
        function openMsgMenu(e, msgId, text) {
            e.preventDefault();
            contextMsgId = msgId;
            contextText = text;
            const menu = document.getElementById('msg-context-menu');
            menu.style.display = 'flex';
            menu.style.left = Math.min(e.clientX, window.innerWidth - 160) + 'px';
            menu.style.top = Math.min(e.clientY, window.innerHeight - 100) + 'px';
        }

        window.addEventListener('click', () => {
            document.getElementById('msg-context-menu').style.display = 'none';
        });

        function copyContextMsg() {
            if (contextText) navigator.clipboard.writeText(contextText);
        }

        function deleteContextMsg() {
            if (contextMsgId && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'delete_msg', msgId: contextMsgId }));
            }
        }

        function openLightbox(src) {
            document.getElementById('lightbox-img').src = src;
            document.getElementById('lightbox').style.display = 'flex';
        }

        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
        }

        function playChime() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                osc.frequency.setValueAtTime(880, ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.08, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.25);
            } catch (e) {}
        }

        function encrypt(data, key) {
            return CryptoJS.AES.encrypt(JSON.stringify(data), key).toString();
        }

        function decrypt(ciphertext, key) {
            try {
                const bytes = CryptoJS.AES.decrypt(ciphertext, key);
                return JSON.parse(bytes.toString(CryptoJS.enc.Utf8));
            } catch (e) {
                return { type: 'text', content: '🔒 Ошибка' };
            }
        }

        function escapeHtml(str) {
            return (str || '').replace(/[&<>'"]/g, t => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[t] || t));
        }

        function escapeAttr(str) {
            return (str || '').replace(/"/g, '&quot;');
        }
    </script>
</body>
