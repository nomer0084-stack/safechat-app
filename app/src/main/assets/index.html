<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>SafeChat</title>
    <script src="crypto-js.min.js"></script>
    <style>
        :root {
            --bg-main: #0e1621;
            --bg-sidebar: #17212b;
            --bg-active: #202b36;
            --bubble-out: #2b5278;
            --bubble-in: #182533;
            --accent: #2aabee;
            --text-primary: #ffffff;
            --text-secondary: #7f91a4;
            --border: rgba(255, 255, 255, 0.08);
            --danger: #ef4444;
            --green: #4fae4e;
            --quote-bar: #2aabee;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-main); color: var(--text-primary); height: 100vh; overflow: hidden; display: flex; }

        /* Авторизация */
        #auth-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(25px); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .auth-card { background: var(--bg-sidebar); border-radius: 26px; padding: 32px 24px; width: 100%; max-width: 340px; text-align: center; border: 1px solid var(--border); box-shadow: 0 25px 50px rgba(0,0,0,0.7); }
        .auth-logo { width: 68px; height: 68px; background: linear-gradient(135deg, #2aabee, #1d6ed8); border-radius: 22px; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; font-size: 34px; box-shadow: 0 10px 25px rgba(42,171,238,0.35); }
        .auth-card h2 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
        .auth-tabs { display: flex; gap: 8px; margin: 20px 0; background: var(--bg-main); padding: 4px; border-radius: 14px; }
        .auth-tab { flex: 1; padding: 10px; border: none; background: none; color: var(--text-secondary); font-size: 14px; font-weight: 600; border-radius: 10px; cursor: pointer; transition: 0.2s; }
        .auth-tab.active { background: var(--accent); color: #fff; box-shadow: 0 2px 8px rgba(42,171,238,0.3); }
        .auth-card input { width: 100%; padding: 14px 16px; background: var(--bg-main); border: 1px solid var(--border); border-radius: 14px; color: #fff; margin-bottom: 12px; font-size: 15px; outline: none; }
        .auth-card input:focus { border-color: var(--accent); }
        .btn-submit { width: 100%; padding: 14px; background: var(--accent); border: none; border-radius: 14px; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; }

        /* Модальные окна */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(15px); display: none; align-items: center; justify-content: center; z-index: 500; padding: 20px; }
        .modal-box { background: var(--bg-sidebar); border-radius: 22px; padding: 24px; width: 100%; max-width: 320px; text-align: center; border: 1px solid var(--border); box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
        .modal-box h3 { margin-bottom: 14px; font-size: 18px; font-weight: 700; }
        .modal-box input { width: 100%; padding: 12px 14px; background: var(--bg-main); border: 1px solid var(--border); border-radius: 12px; color: #fff; margin-bottom: 12px; font-size: 14px; outline: none; }
        .modal-btns { display: flex; gap: 10px; margin-top: 10px; }
        .btn-cancel { flex: 1; padding: 12px; background: rgba(255,255,255,0.08); border: none; border-radius: 12px; color: #fff; cursor: pointer; }
        .btn-confirm { flex: 1; padding: 12px; background: var(--accent); border: none; border-radius: 12px; color: #fff; font-weight: 600; cursor: pointer; }

        /* Полноэкранный оверлей звонка iOS */
        #call-overlay { position: fixed; inset: 0; background: rgba(14, 22, 33, 0.96); backdrop-filter: blur(30px); z-index: 4000; display: none; flex-direction: column; align-items: center; justify-content: space-between; padding: 60px 20px 40px; }
        .call-user-avatar { width: 110px; height: 110px; border-radius: 50%; background: linear-gradient(135deg, #2aabee, #1d6ed8); display: flex; align-items: center; justify-content: center; font-size: 48px; font-weight: 700; color: #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .call-user-name { font-size: 26px; font-weight: 700; margin-top: 18px; }
        .call-status { font-size: 15px; color: var(--accent); margin-top: 6px; }
        .call-controls { display: flex; gap: 30px; align-items: center; }
        .btn-call-action { width: 68px; height: 68px; border-radius: 50%; border: none; font-size: 26px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .btn-call-end { background: var(--danger); color: #fff; }
        .btn-call-accept { background: var(--green); color: #fff; }
        .btn-call-mute { background: rgba(255,255,255,0.15); color: #fff; }

        /* Главный экран */
        #app { display: none; width: 100vw; height: 100vh; position: relative; overflow: hidden; }

        /* Список чатов */
        #sidebar { width: 380px; background: var(--bg-sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; height: 100%; z-index: 1; position: absolute; left: 0; top: 0; bottom: 0; transition: transform 0.28s cubic-bezier(0.32, 0.72, 0, 1); }
        .sidebar-header { padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
        .header-title-box { display: flex; align-items: center; gap: 10px; }
        .my-avatar { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg, #2aabee, #1d6ed8); display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; color: #fff; }
        .user-pill { font-weight: 700; font-size: 16px; }
        .header-btns { display: flex; gap: 8px; align-items: center; }
        .btn-circle { background: rgba(255,255,255,0.06); color: var(--accent); border: none; width: 36px; height: 36px; border-radius: 50%; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        .search-box { padding: 10px 14px; border-bottom: 1px solid var(--border); }
        .search-box input { width: 100%; padding: 10px 14px; background: var(--bg-main); border: 1px solid var(--border); border-radius: 20px; color: #fff; font-size: 14px; outline: none; }

        .chat-list { flex: 1; overflow-y: auto; }
        .chat-item { display: flex; align-items: center; gap: 14px; padding: 12px 16px; cursor: pointer; border-bottom: 1px solid var(--border); transition: background 0.15s; }
        .chat-item:active, .chat-item.active { background: var(--bg-active); }
        .avatar-box { position: relative; width: 50px; height: 50px; flex-shrink: 0; }
        .avatar { width: 100%; height: 100%; border-radius: 50%; background: linear-gradient(135deg, #2aabee, #1d6ed8); display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; color: #fff; }
        .online-dot { position: absolute; bottom: 1px; right: 1px; width: 12px; height: 12px; background: var(--green); border: 2px solid var(--bg-sidebar); border-radius: 50%; display: none; }
        .online-dot.active { display: block; }
        .chat-info { flex: 1; min-width: 0; }
        .chat-header-row { display: flex; justify-content: space-between; align-items: baseline; }
        .chat-name { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-time { font-size: 12px; color: var(--text-secondary); }
        .chat-preview { font-size: 13px; color: var(--text-secondary); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Окно диалога */
        #chat-window { position: absolute; inset: 0; background: var(--bg-main); background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px); background-size: 24px 24px; display: flex; flex-direction: column; z-index: 2; transform: translateX(100%); transition: transform 0.28s cubic-bezier(0.32, 0.72, 0, 1); }
        .chat-header { padding: 10px 16px; background: rgba(23, 33, 43, 0.96); backdrop-filter: blur(25px); display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
        .chat-header-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
        .btn-back { background: none; border: none; color: var(--accent); font-size: 28px; cursor: pointer; line-height: 1; padding-right: 4px; }
        .chat-title { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-status { font-size: 12px; color: var(--text-secondary); }
        .chat-status.online { color: var(--green); }
        .btn-call { background: none; border: none; color: var(--accent); font-size: 22px; cursor: pointer; padding: 6px; }

        #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
        .msg-row { display: flex; width: 100%; position: relative; }
        .msg-row.my { justify-content: flex-end; }
        .msg-row.other { justify-content: flex-start; }
        .bubble { max-width: 78%; padding: 8px 12px; border-radius: 18px; font-size: 15px; line-height: 1.42; word-break: break-word; box-shadow: 0 1px 2px rgba(0,0,0,0.25); cursor: pointer; }
        .msg-row.my .bubble { background: var(--bubble-out); color: #fff; border-bottom-right-radius: 4px; }
        .msg-row.other .bubble { background: var(--bubble-in); color: var(--text-primary); border-bottom-left-radius: 4px; }
        .group-sender-name { font-size: 12px; font-weight: 700; color: #38bdf8; margin-bottom: 3px; }

        /* Плашка ответа (цитата) внутри пузыря */
        .reply-quote-box { background: rgba(0,0,0,0.2); border-left: 3px solid var(--quote-bar); border-radius: 4px; padding: 4px 8px; margin-bottom: 6px; font-size: 12px; }
        .reply-quote-sender { font-weight: 700; color: var(--accent); }
        .reply-quote-text { color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .msg-meta { font-size: 10px; opacity: 0.7; margin-top: 4px; display: flex; justify-content: flex-end; gap: 4px; align-items: center; }

        /* Медиа и Голосовые */
        .bubble img { max-width: 100%; max-height: 320px; border-radius: 12px; margin-top: 4px; display: block; }
        .bubble video { max-width: 100%; border-radius: 12px; margin-top: 4px; display: block; }

        /* Плеер голосовых сообщений Telegram */
        .voice-card { display: flex; align-items: center; gap: 10px; padding: 4px 2px; width: 220px; }
        .voice-play-btn { width: 38px; height: 38px; border-radius: 50%; background: var(--accent); color: #fff; border: none; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .voice-body { flex: 1; display: flex; flex-direction: column; gap: 4px; }
        .voice-waves { display: flex; align-items: center; gap: 2px; height: 18px; }
        .voice-wave-bar { flex: 1; background: rgba(255,255,255,0.3); border-radius: 2px; }
        .voice-meta { display: flex; justify-content: space-between; font-size: 11px; opacity: 0.7; }
        .btn-speed { background: rgba(255,255,255,0.15); border: none; color: #fff; font-size: 10px; font-weight: 700; padding: 2px 5px; border-radius: 4px; cursor: pointer; }

        /* Плашка ответа над полем ввода */
        #reply-bar { background: var(--bg-sidebar); border-top: 1px solid var(--border); padding: 8px 14px; display: none; align-items: center; justify-content: space-between; }
        .reply-bar-content { border-left: 3px solid var(--quote-bar); padding-left: 8px; flex: 1; }
        .reply-bar-title { font-size: 12px; font-weight: 700; color: var(--accent); }
        .reply-bar-text { font-size: 12px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
        .btn-reply-close { background: none; border: none; color: var(--text-secondary); font-size: 18px; cursor: pointer; }

        /* Панель ввода */
        .input-bar { padding: 8px 12px; background: rgba(23, 33, 43, 0.98); backdrop-filter: blur(25px); display: flex; gap: 8px; align-items: center; border-top: 1px solid var(--border); }
        .input-bar input { flex: 1; padding: 10px 16px; background: var(--bg-main); border: 1px solid var(--border); border-radius: 20px; color: #fff; font-size: 15px; outline: none; }
        .btn-action { background: none; border: none; color: var(--text-secondary); font-size: 22px; width: 38px; height: 38px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .btn-send { background: var(--accent); color: #fff; border: none; width: 38px; height: 38px; border-radius: 50%; font-size: 17px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

        /* Панель живой записи голосового Telegram */
        #recording-bar { display: none; flex: 1; align-items: center; gap: 10px; color: #fff; }
        .rec-dot { width: 10px; height: 10px; background: var(--danger); border-radius: 50%; animation: pulse 0.7s infinite alternate; }
        .rec-timer { font-size: 14px; font-weight: 600; font-family: monospace; }
        .rec-cancel { color: var(--danger); font-size: 13px; font-weight: 600; cursor: pointer; margin-left: auto; padding: 4px 8px; }

        /* Контекстное меню */
        #msg-context-menu { position: fixed; background: rgba(23, 33, 43, 0.96); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 14px; padding: 6px; display: none; flex-direction: column; z-index: 3000; box-shadow: 0 10px 30px rgba(0,0,0,0.6); min-width: 160px; }
        .context-item { padding: 10px 14px; font-size: 14px; border: none; background: none; color: #fff; text-align: left; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 10px; }
        .context-item:active { background: var(--bg-active); }
        .context-item.danger { color: var(--danger); }

        @keyframes pulse { from { opacity: 0.2; } to { opacity: 1; } }

        @media (min-width: 769px) {
            #sidebar { width: 380px; position: static; transform: none !important; }
            #chat-window { position: static; transform: none !important; flex: 1; }
            .btn-back { display: none; }
        }
        @media (max-width: 768px) {
            #sidebar { width: 100%; }
            body.in-chat #sidebar { transform: translateX(-25%); }
            body.in-chat #chat-window { transform: translateX(0); }
        }
    </style>
</head>
<body>
    <audio id="remoteAudio" autoplay></audio>

    <!-- Авторизация -->
    <div id="auth-modal">
        <div class="auth-card">
            <div class="auth-logo">🛡️</div>
            <h2>SafeChat</h2>
            <div class="auth-tabs">
                <button class="auth-tab active" id="tab-login" onclick="setAuthMode('login')">Вход</button>
                <button class="auth-tab" id="tab-reg" onclick="setAuthMode('register')">Регистрация</button>
            </div>
            <input type="text" id="username" placeholder="Ваш логин" autocapitalize="none">
            <input type="password" id="password" placeholder="Пароль">
            <button class="btn-submit" id="btn-submit" onclick="submitAuth()">Войти</button>
        </div>
    </div>

    <!-- Модалка: Личный диалог -->
    <div id="new-chat-modal" class="modal">
        <div class="modal-box">
            <h3>Личный диалог</h3>
            <input type="text" id="target-user" placeholder="Логин собеседника..." autocapitalize="none">
            <div class="modal-btns">
                <button class="btn-cancel" onclick="closeModal('new-chat-modal')">Отмена</button>
                <button class="btn-confirm" onclick="confirmNewChat()">Начать</button>
            </div>
        </div>
    </div>

    <!-- Модалка: Групповой чат -->
    <div id="new-group-modal" class="modal">
        <div class="modal-box">
            <h3>Создать группу</h3>
            <input type="text" id="group-title" placeholder="Название группы...">
            <input type="text" id="group-members" placeholder="Логины через запятую (alex, john)..." autocapitalize="none">
            <div class="modal-btns">
                <button class="btn-cancel" onclick="closeModal('new-group-modal')">Отмена</button>
                <button class="btn-confirm" onclick="confirmNewGroup()">Создать</button>
            </div>
        </div>
    </div>

    <!-- Экран аудиозвонка iOS -->
    <div id="call-overlay">
        <div style="display:flex; flex-direction:column; align-items:center;">
            <div class="call-user-avatar" id="call-avatar">?</div>
            <div class="call-user-name" id="call-name">Собеседник</div>
            <div class="call-status" id="call-status-label">Вызов...</div>
        </div>
        <div class="call-controls">
            <button class="btn-call-action btn-call-mute" id="btn-mute" onclick="toggleMuteCall()">🎙️</button>
            <button class="btn-call-action btn-call-end" onclick="endCall()">📞</button>
            <button class="btn-call-action btn-call-accept" id="btn-accept" style="display:none;" onclick="acceptIncomingCall()">📞</button>
        </div>
    </div>

    <!-- Контекстное меню сообщения -->
    <div id="msg-context-menu">
        <button class="context-item" onclick="replyToContextMsg()">↩️ Ответить</button>
        <button class="context-item" onclick="copyContextMsg()">📋 Копировать</button>
        <button class="context-item danger" onclick="deleteContextMsg()">🗑️ Удалить для всех</button>
    </div>

    <div id="app">
        <!-- Список диалогов -->
        <div id="sidebar">
            <div class="sidebar-header">
                <div class="header-title-box">
                    <div class="my-avatar" id="my-avatar-letter">?</div>
                    <span class="user-pill" id="my-label"></span>
                    <button class="btn-circle" onclick="logout()" title="Выйти">🚪</button>
                </div>
                <div class="header-btns">
                    <button class="btn-circle" onclick="openModal('new-group-modal')" title="Создать группу">👥</button>
                    <button class="btn-circle" onclick="openModal('new-chat-modal')" title="Новый диалог">✏️</button>
                </div>
            </div>
            <div class="search-box">
                <input type="text" placeholder="Поиск по чатам..." oninput="filterChats(this.value)">
            </div>
            <div class="chat-list" id="chat-list"></div>
        </div>

        <!-- Окно чата -->
        <div id="chat-window">
            <div class="chat-header">
                <div class="chat-header-left">
                    <button class="btn-back" onclick="closeChat()">‹</button>
                    <div>
                        <div class="chat-title" id="current-chat-title">Чат</div>
                        <div class="chat-status" id="current-chat-status">сквозное шифрование</div>
                    </div>
                </div>
                <button class="btn-call" id="btn-start-call" onclick="startCall()" title="Позвонить">📞</button>
            </div>

            <div id="messages"></div>

            <!-- Плашка ответа (Quote) -->
            <div id="reply-bar">
                <div class="reply-bar-content">
                    <div class="reply-bar-title" id="reply-bar-sender">В ответ на</div>
                    <div class="reply-bar-text" id="reply-bar-text">Текст сообщения</div>
                </div>
                <button class="btn-reply-close" onclick="cancelReply()">✕</button>
            </div>

            <!-- Панель ввода -->
            <div class="input-bar">
                <input type="file" id="file-input" style="display:none;" accept="image/*,video/*" onchange="handleFile(this)">
                <button class="btn-action" onclick="document.getElementById('file-input').click()" title="Фото/Видео">📎</button>

                <!-- Обычный ввод текста -->
                <div id="text-input-wrap" style="flex:1; display:flex;">
                    <input type="text" id="msg-input" placeholder="Сообщение..." oninput="handleTyping()" onkeydown="if(event.key==='Enter') sendText()">
                </div>

                <!-- Режим живой записи голосового Telegram -->
                <div id="recording-bar">
                    <div class="rec-dot"></div>
                    <div class="rec-timer" id="rec-timer">0:00</div>
                    <div class="rec-cancel" onclick="cancelVoiceRecord()">Отмена</div>
                </div>

                <button class="btn-action" id="record-btn" onclick="toggleVoiceRecord()" title="Голосовое">🎙️</button>
                <button class="btn-send" onclick="sendText()">➤</button>
            </div>
        </div>
    </div>

    <script>
        let ws, myUser = '', myPassHash = '', activeChatId = '', activeTitle = '', isCurrentGroup = false, authMode = 'login';
        let allChats = [], replyingMsg = null, contextMsg = null;
        let mediaRecorder, audioChunks = [], isRecording = false, recSeconds = 0, recInterval = null;

        // WebRTC переменные для аудиозвонка
        let peerConnection = null, localStream = null, isCalling = false, callPartner = '';
        const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        function setAuthMode(mode) {
            authMode = mode;
            document.getElementById('tab-login').classList.toggle('active', mode === 'login');
            document.getElementById('tab-reg').classList.toggle('active', mode === 'register');
            document.getElementById('btn-submit').innerText = mode === 'login' ? 'Войти' : 'Создать аккаунт';
        }

        window.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('safechat_session');
            if (saved) {
                try {
                    const session = JSON.parse(saved);
                    if (session.username && session.passHash) connectWS(session.username, session.passHash, 'login', true);
                } catch(e) {}
            }
        });

        function submitAuth() {
            const username = document.getElementById('username').value.trim().toLowerCase();
            const password = document.getElementById('password').value.trim();
            if (!username || !password) return alert('Заполните логин и пароль!');
            const passHash = CryptoJS.SHA256(username + ":" + password).toString();
            connectWS(username, passHash, authMode, false);
        }

        function connectWS(username, passHash, mode, isAuto) {
            const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            const host = location.host || '2.56.118.10';
            ws = new WebSocket("ws://2.56.118.10");

            ws.onopen = () => ws.send(JSON.stringify({ type: mode, username, passHash }));

            ws.onmessage = async (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'auth_success') {
                    myUser = data.username;
                    myPassHash = data.passHash;
                    localStorage.setItem('safechat_session', JSON.stringify({ username: myUser, passHash: myPassHash }));
                    document.getElementById('auth-modal').style.display = 'none';
                    document.getElementById('app').style.display = 'flex';
                    document.getElementById('my-label').innerText = '@' + myUser;
                    document.getElementById('my-avatar-letter').innerText = myUser.charAt(0).toUpperCase();
                } else if (data.type === 'auth_error') {
                    if (isAuto) localStorage.removeItem('safechat_session');
                    else alert(data.message);
                } else if (data.type === 'chat_list') {
                    allChats = data.chats;
                    renderChats(allChats);
                } else if (data.type === 'open_chat') {
                    openChat(data.chatId, data.title, data.isGroup, data.online);
                } else if (data.type === 'history') {
                    if (data.chatId === activeChatId) {
                        isCurrentGroup = data.isGroup;
                        renderMessages(data.messages);
                        updateStatus(data.isGroup, data.companionOnline);
                    }
                } else if (data.type === 'new_msg') {
                    if (data.message.chatId === activeChatId) appendMessage(data.message);
                    if (data.message.sender !== myUser) playChime();
                } else if (data.type === 'msg_deleted') {
                    const el = document.getElementById('msg-' + data.msgId);
                    if (el) el.remove();
                } else if (data.type === 'call_signal') {
                    handleCallSignal(data);
                } else if (data.type === 'error') {
                    alert(data.message);
                }
            };
        }

        function renderChats(chats) {
            const list = document.getElementById('chat-list');
            list.innerHTML = '';
            chats.forEach(chat => {
                const div = document.createElement('div');
                div.className = 'chat-item' + (chat.chatId === activeChatId ? ' active' : '');
                div.onclick = () => openChat(chat.chatId, chat.title, chat.isGroup, chat.online);
                div.innerHTML = `
                    <div class="avatar-box">
                        <div class="avatar">${chat.title.charAt(0).toUpperCase()}</div>
                        <div class="online-dot ${chat.online && !chat.isGroup ? 'active' : ''}"></div>
                    </div>
                    <div class="chat-info">
                        <div class="chat-header-row">
                            <div class="chat-name">${chat.isGroup ? '👥 ' : ''}${escapeHtml(chat.title)}</div>
                            <div class="chat-time">${chat.lastMsgTime || ''}</div>
                        </div>
                        <div class="chat-preview">${chat.isGroup ? 'Групповой чат' : 'Зашифрованный диалог'}</div>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        function openChat(chatId, title, isGroup, online) {
            activeChatId = chatId;
            activeTitle = title;
            isCurrentGroup = isGroup;
            document.body.classList.add('in-chat');
            document.getElementById('current-chat-title').innerText = (isGroup ? '👥 ' : '') + title;
            document.getElementById('btn-start-call').style.display = isGroup ? 'none' : 'block';
            updateStatus(isGroup, online);
            cancelReply();
            ws.send(JSON.stringify({ type: 'get_history', chatId }));
        }

        function closeChat() {
            document.body.classList.remove('in-chat');
            activeChatId = '';
        }

        function updateStatus(isGroup, online) {
            const st = document.getElementById('current-chat-status');
            if (isGroup) { st.innerText = 'группа • шифрование'; st.classList.remove('online'); }
            else if (online) { st.innerText = 'в сети'; st.classList.add('online'); }
            else { st.innerText = 'был(а) недавно'; st.classList.remove('online'); }
        }

        // ================= ОТВЕТЫ НА СООБЩЕНИЯ (REPLY) =================
        function replyToContextMsg() {
            if (!contextMsg) return;
            replyingMsg = { id: contextMsg.id, sender: contextMsg.sender, text: contextMsg.text };
            document.getElementById('reply-bar-sender').innerText = 'В ответ на @' + contextMsg.sender;
            document.getElementById('reply-bar-text').innerText = contextMsg.text;
            document.getElementById('reply-bar').style.display = 'flex';
            document.getElementById('msg-input').focus();
        }

        function cancelReply() {
            replyingMsg = null;
            document.getElementById('reply-bar').style.display = 'none';
        }

        // ================= СООБЩЕНИЯ И МЕДИА =================
        function renderMessages(msgs) {
            const box = document.getElementById('messages');
            box.innerHTML = '';
            msgs.forEach(m => appendMessage(m));
            box.scrollTop = box.scrollHeight;
        }

        function appendMessage(msg) {
            const box = document.getElementById('messages');
            const row = document.createElement('div');
            row.id = 'msg-' + msg.id;
            const isMy = msg.sender === myUser;
            row.className = 'msg-row ' + (isMy ? 'my' : 'other');

            const payload = decrypt(msg.ciphertext, activeChatId + "_secret_key");
            let contentHtml = '';

            if (payload.type === 'text') contentHtml = `<div>${escapeHtml(payload.content)}</div>`;
            else if (payload.type === 'image') contentHtml = `<img src="${payload.content}">`;
            else if (payload.type === 'video') contentHtml = `<video controls playsinline src="${payload.content}"></video>`;
            else if (payload.type === 'voice') contentHtml = createVoiceHtml(payload.content, payload.duration || '0:05');

            let replyHtml = '';
            if (msg.replyTo) {
                replyHtml = `
                    <div class="reply-quote-box">
                        <div class="reply-quote-sender">@${escapeHtml(msg.replyTo.sender)}</div>
                        <div class="reply-quote-text">${escapeHtml(msg.replyTo.text)}</div>
                    </div>
                `;
            }

            let senderNameHtml = (isCurrentGroup && !isMy) ? `<div class="group-sender-name">@${escapeHtml(msg.sender)}</div>` : '';

            row.innerHTML = `
                <div class="bubble" onclick="openMsgMenu(event, '${msg.id}', '${escapeAttr(payload.content || '')}', '${msg.sender}')">
                    ${senderNameHtml}
                    ${replyHtml}
                    ${contentHtml}
                    <div class="msg-meta"><span>${msg.time}</span> ${isMy ? '<span>✓✓</span>' : ''}</div>
                </div>
            `;
            box.appendChild(row);
            box.scrollTop = box.scrollHeight;
        }

        function sendPayload(payload) {
            if (!activeChatId) return;
            const ciphertext = encrypt(payload, activeChatId + "_secret_key");
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            ws.send(JSON.stringify({
                type: 'msg',
                chatId: activeChatId,
                ciphertext,
                time,
                replyTo: replyingMsg
            }));
            cancelReply();
        }

        function sendText() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (!text) return;
            sendPayload({ type: 'text', content: text });
            input.value = '';
        }

        // ================= ГОЛОСОВЫЕ СООБЩЕНИЯ TELEGRAM =================
        async function toggleVoiceRecord() {
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    recSeconds = 0;

                    document.getElementById('text-input-wrap').style.display = 'none';
                    document.getElementById('recording-bar').style.display = 'flex';
                    document.getElementById('record-btn').style.color = 'var(--danger)';

                    recInterval = setInterval(() => {
                        recSeconds++;
                        const m = Math.floor(recSeconds / 60);
                        const s = recSeconds % 60;
                        document.getElementById('rec-timer').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
                    }, 1000);

                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        if (audioChunks.length > 0) {
                            const blob = new Blob(audioChunks, { type: 'audio/webm' });
                            const reader = new FileReader();
                            reader.onload = (e) => sendPayload({ type: 'voice', content: e.target.result, duration: document.getElementById('rec-timer').innerText });
                            reader.readAsDataURL(blob);
                        }
                        stream.getTracks().forEach(t => t.stop());
                    };

                    mediaRecorder.start();
                    isRecording = true;
                } catch(e) { alert('Микрофон недоступен'); }
            } else {
                stopRecordUI();
                mediaRecorder.stop();
            }
        }

        function cancelVoiceRecord() {
            if (isRecording) {
                audioChunks = [];
                stopRecordUI();
                mediaRecorder.stop();
            }
        }

        function stopRecordUI() {
            clearInterval(recInterval);
            isRecording = false;
            document.getElementById('recording-bar').style.display = 'none';
            document.getElementById('text-input-wrap').style.display = 'flex';
            document.getElementById('record-btn').style.color = 'var(--text-secondary)';
        }

        function createVoiceHtml(src, dur) {
            const uid = 'v_' + Math.random().toString(36).substr(2, 6);
            return `
                <div class="voice-card">
                    <button class="voice-play-btn" id="btn-${uid}" onclick="playVoice('${uid}', '${src}')">▶</button>
                    <div class="voice-body">
                        <div class="voice-waves">
                            ${[8,14,6,18,12,16,10,14,18,8,12,16,10,14].map(h => `<div class="voice-wave-bar" style="height:${h}px"></div>`).join('')}
                        </div>
                        <div class="voice-meta">
                            <span id="dur-${uid}">${dur}</span>
                            <button class="btn-speed" onclick="speedVoice('${uid}')">1X</button>
                        </div>
                    </div>
                </div>
            `;
        }

        let activeVoiceAudio = null;
        function playVoice(uid, src) {
            if (activeVoiceAudio && !activeVoiceAudio.paused) {
                activeVoiceAudio.pause();
                activeVoiceAudio = null;
                document.querySelectorAll('.voice-play-btn').forEach(b => b.innerText = '▶');
                return;
            }
            const a = new Audio(src);
            activeVoiceAudio = a;
            const btn = document.getElementById('btn-' + uid);
            btn.innerText = '⏸';
            a.play();
            a.onended = () => { btn.innerText = '▶'; activeVoiceAudio = null; };
        }

        function speedVoice(uid) {
            if (activeVoiceAudio) {
                activeVoiceAudio.playbackRate = activeVoiceAudio.playbackRate === 1 ? 2 : 1;
                event.target.innerText = activeVoiceAudio.playbackRate + 'X';
            }
        }

        // ================= АУДИОЗВОНКИ (WebRTC) =================
        async function startCall() {
            if (isCurrentGroup) return;
            callPartner = activeTitle;
            document.getElementById('call-name').innerText = '@' + callPartner;
            document.getElementById('call-avatar').innerText = callPartner.charAt(0).toUpperCase();
            document.getElementById('call-status-label').innerText = 'Вызов...';
            document.getElementById('btn-accept').style.display = 'none';
            document.getElementById('call-overlay').style.display = 'flex';

            peerConnection = new RTCPeerConnection(rtcConfig);
            localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            peerConnection.ontrack = e => {
                document.getElementById('remoteAudio').srcObject = e.streams[0];
                document.getElementById('call-status-label').innerText = 'Разговор 00:01';
            };

            peerConnection.onicecandidate = e => {
                if (e.candidate) ws.send(JSON.stringify({ type: 'call_signal', sub: 'ice', to: callPartner, candidate: e.candidate }));
            };

            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            ws.send(JSON.stringify({ type: 'call_signal', sub: 'offer', to: callPartner, sdp: offer }));
        }

        async function handleCallSignal(data) {
            if (data.sub === 'offer') {
                callPartner = data.from;
                document.getElementById('call-name').innerText = '@' + callPartner;
                document.getElementById('call-avatar').innerText = callPartner.charAt(0).toUpperCase();
                document.getElementById('call-status-label').innerText = 'Входящий аудиозвонок...';
                document.getElementById('btn-accept').style.display = 'flex';
                document.getElementById('call-overlay').style.display = 'flex';

                peerConnection = new RTCPeerConnection(rtcConfig);
                peerConnection.ontrack = e => document.getElementById('remoteAudio').srcObject = e.streams[0];
                peerConnection.onicecandidate = e => {
                    if (e.candidate) ws.send(JSON.stringify({ type: 'call_signal', sub: 'ice', to: callPartner, candidate: e.candidate }));
                };
                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp));
            } else if (data.sub === 'answer') {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp));
                document.getElementById('call-status-label').innerText = 'Соединено';
            } else if (data.sub === 'ice' && peerConnection) {
                await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
            } else if (data.sub === 'hangup') {
                closeCallUI();
            }
        }

        async function acceptIncomingCall() {
            document.getElementById('btn-accept').style.display = 'none';
            document.getElementById('call-status-label').innerText = 'Соединение...';
            localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            ws.send(JSON.stringify({ type: 'call_signal', sub: 'answer', to: callPartner, sdp: answer }));
        }

        function endCall() {
            if (callPartner) ws.send(JSON.stringify({ type: 'call_signal', sub: 'hangup', to: callPartner }));
            closeCallUI();
        }

        function closeCallUI() {
            if (localStream) localStream.getTracks().forEach(t => t.stop());
            if (peerConnection) peerConnection.close();
            peerConnection = null;
            document.getElementById('call-overlay').style.display = 'none';
        }

        // ================= ГРУППЫ И ДИАЛОГИ =================
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function confirmNewChat() {
            const target = document.getElementById('target-user').value.trim();
            if (target) ws.send(JSON.stringify({ type: 'create_chat', targetUser: target }));
            closeModal('new-chat-modal');
        }

        function confirmNewGroup() {
            const title = document.getElementById('group-title').value.trim();
            const members = document.getElementById('group-members').value.split(',').map(s => s.trim()).filter(Boolean);
            if (title && members.length > 0) {
                ws.send(JSON.stringify({ type: 'create_group', title, members }));
                closeModal('new-group-modal');
            }
        }

        // ================= ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ =================
        function openMsgMenu(e, id, text, sender) {
            e.preventDefault();
            e.stopPropagation();
            contextMsg = { id, text, sender };
            const m = document.getElementById('msg-context-menu');
            m.style.display = 'flex';
            m.style.left = Math.min(e.clientX || 50, window.innerWidth - 180) + 'px';
            m.style.top = Math.min(e.clientY || 100, window.innerHeight - 140) + 'px';
        }
        window.addEventListener('click', () => document.getElementById('msg-context-menu').style.display = 'none');

        function copyContextMsg() { if (contextMsg) navigator.clipboard.writeText(contextMsg.text); }
        function deleteContextMsg() { if (contextMsg) ws.send(JSON.stringify({ type: 'delete_msg', msgId: contextMsg.id })); }

        function encrypt(data, key) { return CryptoJS.AES.encrypt(JSON.stringify(data), key).toString(); }
        function decrypt(cipher, key) {
            try { return JSON.parse(CryptoJS.AES.decrypt(cipher, key).toString(CryptoJS.enc.Utf8)); }
            catch(e) { return { type: 'text', content: '🔒 Ошибка' }; }
        }
        function playChime() {
            try {
                const c = new (window.AudioContext || window.webkitAudioContext)();
                const o = c.createOscillator(); const g = c.createGain();
                o.frequency.setValueAtTime(587.33, c.currentTime);
                o.frequency.setValueAtTime(880, c.currentTime + 0.08);
                g.gain.setValueAtTime(0.08, c.currentTime);
                g.gain.exponentialRampToValueAtTime(0.01, c.currentTime + 0.25);
                o.connect(g); g.connect(c.destination);
                o.start(); o.stop(c.currentTime + 0.25);
            } catch(e) {}
        }
        function escapeHtml(s) { return (s || '').replace(/[&<>'"]/g, t => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[t] || t)); }
        function escapeAttr(s) { return (s || '').replace(/"/g, '&quot;'); }
        function logout() { if (confirm('Выйти?')) { localStorage.removeItem('safechat_session'); location.reload(); } }
    </script>
</body>
